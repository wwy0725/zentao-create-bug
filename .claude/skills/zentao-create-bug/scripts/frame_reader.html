<!doctype html>
<html>
<head><meta charset="utf-8"><title>frame reader</title></head>
<body style="margin:0;background:#000">
<!-- 用法：把本文件复制到视频所在目录，将 __VIDEO_FILE__ 替换为视频文件名（同目录相对路径），
     然后在该目录起 python -m http.server <端口> --bind 127.0.0.1，浏览器打开本页。用完删除本文件。 -->
<video id="v" src="./__VIDEO_FILE__" style="width:100vw;display:block" muted preload="auto"></video>
</body>
</html>
